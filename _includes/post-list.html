<div class="posts">
  {% for post in include.posts %}
  <article class="post">
    <h2 class="post-title">
      <a href="{{ post.url }}">{{ post.title }}</a>
    </h2>
    <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date_to_string }}</time>
    {{ post.excerpt }}
    <p><a href="{{ post.url }}">Read more<span class="visually-hidden"> about {{ post.title }}</span>…</a></p>
  </article>
  {% endfor %}
</div>
