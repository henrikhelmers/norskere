<div class="posts">
  {% for post in include.posts %}
  <div class="post">
    <h1 class="post-title">
      <a href="{{ post.url }}">{{ post.title }}</a>
    </h1>
    <span class="post-date">{{ post.date | date_to_string }}</span>
    {{ post.excerpt }}
    <p><a href="{{ post.url }}">Read more…</a></p>
  </div>
  {% endfor %}
</div>
